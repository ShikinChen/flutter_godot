# 配置 Dart 静态分析器，用于检查代码错误、警告和规范问题。
#
# 支持 Dart 的开发工具会显示分析结果，参见 https://dart.dev/tools#ides-and-editors。
# 也可在命令行执行 flutter analyze 运行分析器。

# 启用适用于 Flutter 应用、包和插件的推荐代码检查规则。
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**

linter:
  # 可在下方自定义检查规则，禁用上方 flutter_lints 中的规则
  # 或启用额外规则。完整规则列表及说明参见 https://dart.dev/lints。
  #
  # 也可在对应代码行或 Dart 文件中使用 // ignore: name_of_lint
  # 或 // ignore_for_file: name_of_lint，仅对该行或该文件忽略规则，
  # 无需在整个项目中禁用。
  rules:
    # avoid_print: false  # 取消注释以禁用 avoid_print 规则
    # prefer_single_quotes: true  # 取消注释以启用 prefer_single_quotes 规则

# 此配置文件的更多说明参见：
# https://dart.dev/guides/language/analysis-options

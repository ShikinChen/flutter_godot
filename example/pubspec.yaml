name: flutter_godot_example
description: "Demonstrates how to use the flutter_godot plugin."
# 禁止通过 flutter pub publish 意外发布到 pub.dev，适用于私有包。
publish_to: 'none' # 需要发布到 pub.dev 时移除此配置

environment:
  sdk: ^3.13.7

# 声明运行所需依赖。可执行 flutter pub upgrade --major-versions 升级依赖，
# 也可手动修改下方版本号。执行 flutter pub outdated 查看可更新的依赖。
dependencies:
  flutter:
    sdk: flutter

  flutter_godot:
    # 在实际应用中可使用版本依赖，例如：
    #   flutter_godot: ^x.y.z
    # 版本约束说明参见 https://dart.dev/tools/pub/dependencies#version-constraints
    # 此示例随插件提供，因此使用父目录的本地路径依赖，
    # 以运行当前插件版本。
    path: ../

  # 添加 Cupertino 图标字体，配合 CupertinoIcons 类显示 iOS 风格图标。
  cupertino_icons: ^1.0.8

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

  # flutter_lints 提供推荐的代码检查规则，
  # 在项目根目录的 analysis_options.yaml 中启用。
  # 可在该文件中禁用指定规则或启用其他规则。
  flutter_lints: ^6.0.0

# 本文件中 Dart 通用配置的说明参见 https://dart.dev/tools/pub/pubspec。

# 以下为 Flutter 包专用配置。
flutter:
  config:
    enable-swift-package-manager: false

  # 将 Material 图标字体打包到应用中，供 Icons 类使用。
  uses-material-design: true

  # 在应用中添加资源时，可按以下示例配置 assets：
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # 图片资源可包含适配不同分辨率的变体，参见：
  # https://flutter.dev/to/resolution-aware-images

  # 引用依赖包资源的说明参见：
  # https://flutter.dev/to/asset-from-package

  # 添加自定义字体时，在 flutter 下配置 fonts。每项包含字体族名 family，
  # 以及声明资源和字体属性的 fonts 列表。例如：
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # 使用依赖包字体的说明参见 https://flutter.dev/to/font-from-package。

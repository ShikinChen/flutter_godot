// Godot 引擎 Android 平台的 Gradle 构建配置。
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

apply from: file('../../../android/build/config.gradle')

allprojects {
    repositories {
        google()
        mavenCentral()
        String[] mavenRepos = getGodotPluginsMavenRepos()
        if (mavenRepos != null) {
            mavenRepos.each { repoUrl -> maven { url repoUrl } }
        }
    }
}


ext {
    projDir = file("../../../android/build")
}

configurations {
    // 为 devImplementation 依赖配置创建占位项。
    devImplementation {}
    // 为 monoImplementation 依赖配置创建占位项。
    monoImplementation {}
}

dependencies {
    implementation "androidx.fragment:fragment:$versions.fragmentVersion"
    implementation "androidx.core:core-splashscreen:$versions.splashscreenVersion"

    implementation "com.google.code.gson:gson:2.11.0"

    implementation project(":godot_android:game_lib")

//    debugImplementation fileTree(dir: "${projDir}/godot/game_lib/game_lib-standard", include: ['**/*.jar', '*.aar'])

//    debugImplementation project(":godot_lib_debug")
}

android {
    compileSdkVersion versions.compileSdk
    buildToolsVersion versions.buildTools
    ndkVersion versions.ndkVersion

    compileOptions {
        sourceCompatibility versions.javaVersion
        targetCompatibility versions.javaVersion
    }

    kotlinOptions {
        jvmTarget = versions.javaVersion
    }

    assetPacks = [":assetPackInstallTime"]

    namespace = 'com.godot.game'

    defaultConfig {
        // assets 目录的默认忽略规则会排除 Godot 使用的隐藏文件和目录，此处调整规则以保留它们。
        aaptOptions {
            ignoreAssetsPattern "!.svn:!.git:!.gitignore:!.ds_store:!*.scc:<dir>_*:!CVS:!thumbs.db:!picasa.ini:!*~"
        }

        ndk {
            debugSymbolLevel 'NONE'
            String[] export_abi_list = getExportEnabledABIs()
            abiFilters export_abi_list
        }

        // 请按需修改为自己的应用 ID。
        applicationId getExportPackageName()
        versionCode getExportVersionCode()
        versionName getExportVersionName()
        minSdkVersion getExportMinSdkVersion()
        targetSdkVersion getExportTargetSdkVersion()

        missingDimensionStrategy 'products', 'template'
    }

    lintOptions {
        abortOnError false
        disable 'MissingTranslation', 'UnusedResources'
    }

    ndkVersion versions.ndkVersion

    packagingOptions {
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/NOTICE'

        // 保留调试符号，供 Android Studio 开发调试使用。
        if (shouldNotStrip()) {
            jniLibs {
                keepDebugSymbols += '**/*.so'
            }
        }

        jniLibs {
            // 设置为 true 时，AGP 会在构建应用时压缩打包原生库。
            // 背景说明参见：
            // - https://developer.android.com/build/releases/past-releases/agp-3-6-0-release-notes#extractNativeLibs
            // - https://stackoverflow.com/a/44704840
            useLegacyPackaging shouldUseLegacyPackaging()
        }

        // 依赖中也包含 libc++_shared.so 时，统一选用 Godot 的版本。
        pickFirst 'lib/x86/libc++_shared.so'
        pickFirst 'lib/x86_64/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
    }

    signingConfigs {
        debug {
            if (hasCustomDebugKeystore()) {
                storeFile new File(getDebugKeystoreFile())
                storePassword getDebugKeystorePassword()
                keyAlias getDebugKeyAlias()
                keyPassword getDebugKeystorePassword()
            }
        }

        release {
            File keystoreFile = new File(getReleaseKeystoreFile())
            if (keystoreFile.isFile()) {
                storeFile keystoreFile
                storePassword getReleaseKeystorePassword()
                keyAlias getReleaseKeyAlias()
                keyPassword getReleaseKeystorePassword()
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {

        debug {
            // 预编译构建跳过签名和 ZIP 对齐；
            // Godot Gradle 构建则执行这些步骤。
            zipAlignEnabled shouldZipAlign()
            if (shouldSign()) {
                signingConfig signingConfigs.debug
            } else {
                signingConfig null
            }
            packagingOptions {
                doNotStrip "*/arm64-v8a/*.so"
                doNotStrip "*/armeabi-v7a/*.so"
            }
        }

        dev {
            initWith debug
            // 预编译构建跳过签名和 ZIP 对齐；
            // Godot Gradle 构建则执行这些步骤。
            zipAlignEnabled shouldZipAlign()
            if (shouldSign()) {
                signingConfig signingConfigs.debug
            } else {
                signingConfig null
            }
            packagingOptions {
                doNotStrip "*/arm64-v8a/*.so"
                doNotStrip "*/armeabi-v7a/*.so"
            }
        }

        release {
            // 预编译构建跳过签名和 ZIP 对齐；
            // Godot Gradle 构建则执行这些步骤。
            zipAlignEnabled shouldZipAlign()
            if (shouldSign()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig null
            }
        }
    }

    flavorDimensions 'edition'

    productFlavors {
        standard {
            getIsDefault().set(true)
        }
        mono {}
    }

    sourceSets {
        main {
            manifest.srcFile "AndroidManifest.xml"
            java.srcDirs = ["src"]
            res.srcDirs = ["res", "${projDir}/res"]
            aidl.srcDirs = []
            assets.srcDirs = []
        }
        debug.jniLibs.srcDirs = []
        dev.jniLibs.srcDirs = []
        release.jniLibs.srcDirs = []
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            String filenameSuffix = variant.flavorName == "mono" ? variant.name : variant.buildType.name
            output.outputFileName = "android_${filenameSuffix}.apk"
        }
    }
}

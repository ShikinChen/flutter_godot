plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

ext {
    DEBUG_PUBLISH_ARTIFACT_ID = 'godot-debug'
    PUBLISH_ARTIFACT_ID = 'godot'
    TOOLS_PUBLISH_ARTIFACT_ID = 'godot-tools'

    projDir = project.file("../../../android/build")
}


configurations {
    monoImplementation {}
}

dependencies {
    implementation "androidx.fragment:fragment:$versions.fragmentVersion"

    if (rootProject.findProject(":lib")) {
        api project(":lib")
    } else if (rootProject.findProject(":godot:lib")) {
        api project(":godot:lib")
    } else {
        debugApi project(":godot_lib_debug")
        releaseApi project(":godot_lib_release")
    }

    implementation "androidx.core:core-splashscreen:$versions.splashscreenVersion"

    // Godot user plugins remote dependencies
    String[] remoteDeps = getGodotPluginsRemoteBinaries()
    if (remoteDeps != null && remoteDeps.size() > 0) {
        for (String dep : remoteDeps) {
            implementation dep
        }
    }

    // Godot user plugins local dependencies
    String[] pluginsBinaries = getGodotPluginsLocalBinaries()
    if (pluginsBinaries != null && pluginsBinaries.size() > 0) {
        implementation files(pluginsBinaries)
    }

    // Automatically pick up local dependencies in res://addons
    String addonsDirectory = getAddonsDirectory()
    if (addonsDirectory != null && !addonsDirectory.isBlank()) {
        implementation fileTree(dir: "$addonsDirectory", include: ['*.jar', '*.aar'])
    }

    // .NET dependencies
    String jar = rootProject.file('../../godot/modules/mono/thirdparty/libSystem.Security.Cryptography.Native.Android.jar').absolutePath
    if (file(jar).exists()) {
        monoImplementation files(jar)
    }

    testImplementation "junit:junit:4.13.2"
}

android {
    compileSdkVersion versions.compileSdk
    buildToolsVersion versions.buildTools
    ndkVersion versions.ndkVersion

    defaultConfig {
        minSdkVersion versions.minSdk
        targetSdkVersion versions.targetSdk

        manifestPlaceholders = [godotLibraryVersion: getGodotLibraryVersionName()]

        // The default ignore pattern for the 'assets' directory includes hidden files and directories which are used by Godot projects.
        aaptOptions {
            ignoreAssetsPattern "!.svn:!.git:!.gitignore:!.ds_store:!*.scc:<dir>_*:!CVS:!thumbs.db:!picasa.ini:!*~"
        }

        ndk {
            debugSymbolLevel 'NONE'
            String[] export_abi_list = getExportEnabledABIs()
            abiFilters export_abi_list
        }

        missingDimensionStrategy 'products', 'template'
    }

    namespace = "org.godotengine.godot.game.lib"

    compileOptions {
        sourceCompatibility versions.javaVersion
        targetCompatibility versions.javaVersion
    }

//     assetPacks = [":assetPackInstallTime"]

    kotlinOptions {
        jvmTarget = versions.javaVersion
    }

    buildFeatures {
        aidl = true
        buildConfig = true
    }

    buildTypes {
        dev {
            initWith debug
        }
    }

    flavorDimensions 'edition'
    productFlavors {
        standard {
        }
        mono {
            getIsDefault().set(true)
        }
    }

    lintOptions {
        abortOnError false
        disable 'MissingTranslation', 'UnusedResources'
    }

    packagingOptions {
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/NOTICE'

        // Debug symbols are kept for development within Android Studio.
        if (shouldNotStrip()) {
            jniLibs {
                keepDebugSymbols += '**/*.so'
            }
        }

        jniLibs {
            // Setting this to true causes AGP to package compressed native libraries when building the app
            // For more background, see:
            // - https://developer.android.com/build/releases/past-releases/agp-3-6-0-release-notes#extractNativeLibs
            // - https://stackoverflow.com/a/44704840
            useLegacyPackaging shouldUseLegacyPackaging()
        }

        // Always select Godot's version of libc++_shared.so in case deps have their own
        pickFirst 'lib/x86/libc++_shared.so'
        pickFirst 'lib/x86_64/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
    }

    sourceSets {
        main {
            manifest.srcFile "AndroidManifest.xml"
            res.srcDirs = ["${projDir}/res"]
            java.srcDirs = ["src"]
            aidl.srcDirs = ["${projDir}/aidl"]
            assets.srcDirs = ["${projDir}/src/main/assets"]
        }

        debug.jniLibs.srcDirs = ["${projDir}/libs/debug", "${projDir}/libs/debug/vulkan_validation_layers"]
        dev.jniLibs.srcDirs = ["${projDir}/libs/dev"]
        release.jniLibs.srcDirs = ["${projDir}/libs/release"]
    }
}

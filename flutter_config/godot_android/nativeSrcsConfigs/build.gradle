// 仅用于为项目提供 Android Studio 编辑支持的占位 Android 库。
plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

ext {
    nativeLibDir = rootProject.file("godot/godot_lib/platform/android/java/nativeSrcsConfigs")
}


android {
    compileSdkVersion versions.compileSdk
    buildToolsVersion versions.buildTools
    ndkVersion versions.ndkVersion

    namespace = "org.godotengine.godot"

    defaultConfig {
        minSdkVersion versions.minSdk
        targetSdkVersion versions.targetSdk

        externalNativeBuild {
            cmake {
                arguments "-DVULKAN_ENABLED=1", "-DGLES3_ENABLED=1"
            }
        }
    }

    compileOptions {
        sourceCompatibility versions.javaVersion
        targetCompatibility versions.javaVersion
    }

    kotlinOptions {
        jvmTarget = versions.javaVersion
    }

    packagingOptions {
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/NOTICE'
    }

    sourceSets {
        main {
            manifest.srcFile "${nativeLibDir}/AndroidManifest.xml"
        }
    }

    externalNativeBuild {
        cmake {
            path "${nativeLibDir}/CMakeLists.txt"
        }
    }

    libraryVariants.all { variant ->
        def buildType = variant.buildType.name.capitalize()

        def taskPrefix = ""
        if (project.path != ":") {
            taskPrefix = project.path + ":"
        }

        // 禁用 externalNativeBuild* 任务；CMake 配置仅用于编辑支持，
        // 实际执行这些构建任务会导致失败。
        gradle.startParameter.excludedTaskNames += taskPrefix + "externalNativeBuild" + buildType
    }
}

dependencies {}

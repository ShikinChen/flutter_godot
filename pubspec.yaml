name: flutter_godot
description: "Embed Godot in Flutter using Android textures or iOS native views with platform messages."
version: 0.0.1
homepage:

environment:
  sdk: ^3.13.7
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# 本文件中 Dart 通用配置的说明参见 https://dart.dev/tools/pub/pubspec。

# 以下为 Flutter 包专用配置。
flutter:
  # 声明此项目为 Flutter 插件。pluginClass 指定注册到插件注册表的原生类，
  # 用于方法通道通信；Android 的 package 指定该类所在的包。
  # 使用 dart:ffi 时，ffiPlugin 用于声明需要编译并打包的原生代码。
  # Flutter 工具据此维护插件及资源配置。
  plugin:
    platforms:
      android:
        package: me.shiki.flutter_godot
        pluginClass: FlutterGodotPlugin
      ios:
        pluginClass: FlutterGodotPlugin

  # 在插件包中添加资源时，可按以下示例配置 assets：
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # 包内资源的说明参见：
  # https://flutter.dev/to/asset-from-package
  #
  # 图片资源可包含适配不同分辨率的变体，参见：
  # https://flutter.dev/to/resolution-aware-images

  # 添加自定义字体时，在 flutter 下配置 fonts。每项包含字体族名 family，
  # 以及声明资源和字体属性的 fonts 列表。例如：
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # 包内字体的说明参见：
  # https://flutter.dev/to/font-from-package
